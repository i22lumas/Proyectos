name: 'Mobile-D Stabilize Pipeline'

on:
  push:
    branches:
      - main

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: 'wrapper'

jobs:
  stabilize:
    name: Stabilize Build & Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: 'Make Gradle Executable'
        run: chmod +x ./gradlew
        shell: bash

      - name: 'Run Unit Tests'
        run: ./gradlew test --info
        continue-on-error: true

      - name: 'Publish Test Results'
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/build/test-results/**/*.xml'
          check_name: 'Unit Test Results'
          comment_title: 'Test Summary'

      - name: 'Assemble Debug APK'
        run: ./gradlew assembleDebug --info

      - name: 'Verify APK Generated'
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK no fue generado correctamente"
            exit 1
          fi
          echo "✓ APK generado exitosamente en: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $9, "(" $5 ")"}')"

      - name: 'Upload APK Artifact'
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 'app-debug-apk'
          path: 'app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 30
          if-no-files-found: error

      - name: 'Generate Code Coverage Report'
        run: ./gradlew jacocoTestReport
        continue-on-error: true

      - name: 'Upload Coverage to Codecov'
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          flags: 'unittests'
          fail_ci_if_error: false

      - name: 'Build Status Notification'
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Pipeline Stabilize completado exitosamente"
          else
            echo "❌ Pipeline Stabilize falló"
            exit 1
          fi

      - name: 'Print Build Info'
        if: always()
        run: |
          echo "=== Build Information ==="
          echo "Java Version: $(java -version 2>&1 | head -1)"
          echo "Gradle Version: $(./gradlew --version | head -1)"
          echo "Build Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  code-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    needs: stabilize
    if: always()

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 'Run Lint'
        run: |
          chmod +x ./gradlew
          ./gradlew lint --info
        continue-on-error: true

      - name: 'Upload Lint Results'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'lint-results'
          path: '**/build/reports/lint-results*.html'
          retention-days: 30
          if-no-files-found: ignore
